[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latheport"
version = "1.5.0"
description = "Convert, compress, edit or extract any file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pure Tech" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",  # QRhiWidget, for the 3D viewer
    "Pillow>=11.3",
    "pillow-heif>=0.18",
    "py7zr>=0.22",
    "pypdfium2>=5.0",  # PDFium: reading and drawing PDFs (BSD / Apache)
    "PyYAML>=6",
    "tomli-w>=1.0",
    "openpyxl>=3.1",
    "fonttools[woff]>=4.50",
    "puremagic>=1.20",
    "markdown>=3.5",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "mammoth>=1.8",
    "numpy>=1.26",
    "trimesh>=4.4",
    "networkx>=3",
    "lxml>=5",
    "pycollada>=0.8",
    "gmsh>=4.13",  # STEP/IGES/BREP; the Windows download fetches it the first time it is needed
    "onnxruntime>=1.20",  # the smart tools; the Windows download fetches it the first time one is used
    "ezdxf>=1.3",
    "pydicom>=3.0",
    "pyjpegls>=1.2",
    # pinned to a release tag, so a later push to any of these repos can't change what Latheport installs
    "meshport @ git+https://github.com/puretechteam/meshport@v0.5.0",
    "packport @ git+https://github.com/puretechteam/packport@v0.4.0",
    # packport's compiled decoders, from its release (elsewhere packport decodes in Python)
    "packport-native @ https://github.com/puretechteam/packport/releases/download/v0.4.0/packport_native-0.4.0-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "bookport @ git+https://github.com/puretechteam/bookport@v0.4.0",
    # bookport's and pixport's compiled decoders (pixport's also does JPEG XL), from their releases
    "bookport-native @ https://github.com/puretechteam/bookport/releases/download/v0.4.0/bookport_native-0.4.0-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "pixport @ git+https://github.com/puretechteam/pixport@v0.2.0",
    "pixport-native @ https://github.com/puretechteam/pixport/releases/download/v0.2.0/pixport_native-0.2.0-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    # plays videos in the editor (FFmpeg decoders, WASAPI sound); pure Python
    "puretech-player @ git+https://github.com/puretechteam/puretech-player@v0.1.2",
    "vtracer>=0.6",
    "pysubs2>=1.7",
    "pycdlib>=1.14",
    "lz4>=4",
    "brotli>=1.1",
    "olefile>=0.46",
    "backports.zstd>=1.0; python_version < '3.14'",  # Python 3.14 has compression.zstd built in
]

[project.optional-dependencies]
# PyMuPDF: only a second opinion in the tests (what a PDF reads as); Latheport itself uses PDFium
dev = ["pytest>=8", "pyinstaller>=6", "ruff>=0.16,<0.17", "PyMuPDF>=1.24"]

[project.urls]
Source = "https://github.com/puretechteam/Latheport"
Changelog = "https://github.com/puretechteam/Latheport/blob/main/CHANGELOG.md"

[project.scripts]
latheport = "latheport.cli:main"

[project.gui-scripts]
latheport-gui = "latheport.instance:main"

[tool.setuptools.packages.find]
include = ["latheport*"]

[tool.setuptools.package-data]
latheport = ["assets/*", "assets/shaders/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any warning fails a test: each one is either fixed or listed here with the reason.
filterwarnings = [
    "error",
    # pycollada 0.9.3 (the newest) sets ndarray.shape, which NumPy 2.5 deprecated: DAE files still
    # read and write correctly, and the DAE tests fail the day a NumPy release removes it
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:collada",
    # FFmpeg writes .ssa files with ASS-style fields; pysubs2 warns and takes the default
    # alignment, which is the one those files mean (no category: pysubs2.warnings is new in 1.9,
    # which needs Python 3.12, so naming its class breaks the suite on 3.11)
    "ignore:Failed to parse alignment::pysubs2",
]

[tool.ruff]
extend-exclude = ["app", "build", "dist"]
